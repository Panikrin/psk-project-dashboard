name: TickTick → ПСК
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ticktick-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Проверить публичный вход и защиту задач
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://psk-project-dashboard.denis-panikrin.chatgpt.site';
          const github=await fetch('https://panikrin.github.io/psk-project-dashboard/');
          assert.equal(github.status,200,'GitHub Pages must be published');
          assert.ok((await github.text()).includes('Пароль команды · 6 цифр'));
          const origin='https://panikrin.github.io';
          const preflight=await fetch(base+'/api/auth',{method:'OPTIONS',headers:{Origin:origin,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'authorization,content-type'}});
          assert.equal(preflight.status,204);
          assert.equal(preflight.headers.get('access-control-allow-origin'),origin);
          const denied=await fetch(base+'/api/dashboard',{headers:{Origin:origin}});
          assert.equal(denied.status,401);
          assert.equal(denied.headers.get('access-control-allow-origin'),origin);
          const foreign=await fetch(base+'/api/dashboard',{method:'OPTIONS',headers:{Origin:'https://foreign.test'}});
          assert.equal(foreign.status,403);
          const login=await fetch(base+'/login',{redirect:'manual'});
          assert.equal(login.status,200,'Public login must open without ChatGPT');
          const html=await login.text();
          assert.ok(html.includes('Вход для команды')&&html.includes('pattern="[0-9]{6}"'),'Team code form required');
          const dashboard=await fetch(base+'/dashboard',{redirect:'manual'});
          assert.equal(dashboard.status,302);
          assert.equal(new URL(dashboard.headers.get('location'),base).pathname,'/login');
          for(const [path,status] of [['/api/dashboard',401],['/api/media',401],['/api/projects',401],['/api/admin',403]]){
            const r=await fetch(base+path,{redirect:'manual'});
            assert.equal(r.status,status,path);
            assert.ok(r.headers.get('content-type')?.includes('application/json'),'Application authorization must protect '+path);
          }
          assert.equal((await (await fetch(base+'/api/auth')).json()).authenticated,false);
          console.log('PASS: public six-digit login, no ChatGPT account required, private data protected');
          JS
      - name: Обновить задачи и проверить сохранение
        env:
          PSK_SYNC_SERVICE_KEY: ${{ secrets.PSK_SYNC_SERVICE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const key=process.env.PSK_SYNC_SERVICE_KEY;
          if(!key)throw Error('Не настроен ключ обновления');
          const url='https://psk-project-dashboard.denis-panikrin.chatgpt.site/api/ticktick/sync';
          async function call(method){const r=await fetch(url,{method,redirect:'error',headers:{'X-PSK-Sync-Key':key},signal:AbortSignal.timeout(90000)});if(!r.ok)throw Error('Сервис обновления ответил '+r.status);return r.json();}
          let result=await call('POST');
          if(result.busy){await new Promise(r=>setTimeout(r,30000));result=await call('POST');}
          if(!result.connected||!result.enabled||result.busy)throw Error('Обновление не выполнено');
          const saved=await call('GET');
          if(!saved.connected||!saved.enabled||saved.lastError||!saved.lastSuccess||Date.now()-Date.parse(saved.lastSuccess)>300000)throw Error('Сохранённое обновление не подтверждено');
          console.log(JSON.stringify({lastSuccess:saved.lastSuccess,revision:saved.dashboardRevision,tasks:saved.taskCount,active:saved.activeTaskCount}));
          JS
