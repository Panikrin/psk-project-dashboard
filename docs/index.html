<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — ПСК</title><style>@font-face{font-family:Manrope;src:url('./fonts/manrope-500.ttf')}*{box-sizing:border-box}body{margin:0;background:#f3f3f1;color:#222;font:15px/1.6 Manrope,system-ui;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:38px;max-width:430px;width:100%}.logo{font-size:33px;font-weight:800;letter-spacing:-1px}h1{font-size:25px;margin:22px 0 8px}p{color:#777;font-size:13px}label{font-size:12px;display:block;margin-top:24px}input{width:100%;padding:13px;border:1px solid #bbb;border-radius:6px;margin:8px 0 14px;font:inherit}button{width:100%;padding:13px;background:#222;color:#fff;border:0;border-radius:6px;font:inherit;cursor:pointer}a{color:#777;font-size:11px}#error{min-height:24px;color:#922;font-size:12px}.foot{display:flex;justify-content:space-between;gap:15px;margin-top:26px;font-size:11px;color:#999}</style><main class="card"><div class="logo">ПСК.</div><h1>Вход для команды</h1><p>Проекты, задачи и сроки в одном месте.</p><form id="login"><label for="password">Пароль команды · 6 цифр</label><input type="password" id="password" autocomplete="current-password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" title="Ровно 6 цифр" required autofocus><button type="submit" id="submit">Войти</button><p id="error" role="alert"></p></form><div class="foot"><span>ПСК Строй-Проект</span><a href="https://psk-project-dashboard.denis-panikrin.chatgpt.site/signin-with-chatgpt?return_to=%2Fsettings" target="_top">Вход владельца</a></div></main><script>
window.pskPages=(()=>{
 const api="https://psk-project-dashboard.denis-panikrin.chatgpt.site",base=new URL('.',location.href).pathname,key='psk-team-session:'+api;
 const read=()=>{try{return sessionStorage.getItem(key)||'';}catch{return '';}};
 const save=token=>{if(!/^[a-f0-9]{64}$/.test(token))throw Error('Не удалось подтвердить вход.');sessionStorage.setItem(key,token);};
 const clear=()=>{try{sessionStorage.removeItem(key);}catch{}};
 async function request(input,init={}){const relative=String(input);if(!relative.startsWith('/api/'))throw Error('Unexpected API path');const headers=new Headers(init.headers),token=read();if(token)headers.set('Authorization','Bearer '+token);return fetch(api+relative,{cache:'no-store',...init,headers,credentials:'omit',redirect:'error'});}
 return {api,base,read,save,clear,request};
})();
const pskFetch=(...args)=>pskPages.request(...args);
</script><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),p=document.getElementById('password'),error=document.getElementById('error');b.disabled=true;error.textContent='';try{const r=await pskFetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const d=await r.json();p.value='';if(!r.ok)throw Error(d.error||'Не удалось войти.');pskPages.save(d.sessionToken);location.assign(pskPages.base+'dashboard.html');}catch(e){p.value='';error.textContent=e.message;}finally{b.disabled=false;}};</script></html>
